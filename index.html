    <!-- Shared with LoadingScreen. Inline so the startup loader can paint before the app bundle. -->
    <style>
      .store-loader {
        display: grid;
        place-items: center;
        background: #fff;
        color: #1c1917;
        font-family: system-ui, sans-serif;
      }
      .store-loader--screen { position: fixed; inset: 0; z-index: 55; }
      .store-loader--inline {
        min-height: min(75vh, 38rem);
        padding-top: var(--store-header-height, 72px);
      }
      #app-splash { transition: opacity 180ms ease-out, visibility 0s linear 180ms; }
      #app-splash.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
      #app-splash.is-ready .store-loader-content,
      #app-splash.is-ready .store-loader-track::before { animation-play-state: paused; }
      .store-loader-content {
        display: grid;
        justify-items: center;
        gap: 16px;
        animation: store-loader-appear 200ms ease-out 100ms backwards;
      }
      .store-loader-brand {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 21px;
        font-weight: 700;
      }
      .store-loader-mark { width: 32px; height: 23px; overflow: hidden; position: relative; }
      .store-loader-mark img { position: absolute; top: -2px; left: -8px; width: 48px; max-width: none; height: auto; }
      .store-loader-track {
        width: 124px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: #e8eeea;
      }
      .store-loader-track::before {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: #047857;
        animation: store-loader-flow 1.45s cubic-bezier(.4, 0, .25, 1) infinite;
      }
      .store-loader-message {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes store-loader-appear { from { opacity: 0; } to { opacity: 1; } }
      @keyframes store-loader-flow {
        from { transform: translateX(-105%); }
        to { transform: translateX(235%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition: none; }
        .store-loader-content, .store-loader-track::before { animation: none; }
        .store-loader-track::before { margin-inline: auto; }
      }
    </style>
